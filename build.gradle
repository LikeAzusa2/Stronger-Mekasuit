plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.139'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://modmaven.dev/artifactory/local-releases/" }
}

neoForge {
    version = project.neoforge_version
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
    mods {
        create(project.mod_id) {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly("mekanism:Mekanism:${mekanism_runtime_version}")
    localRuntime("mekanism:Mekanism:${mekanism_runtime_version}")
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_version      : mod_version,
            mod_license      : mod_license,
            mod_authors      : mod_authors,
            mod_description  : mod_description,
            minecraft_range  : minecraft_version_range,
            neoforge_range   : neoforge_version_range,
            mekanism_range   : mekanism_version_range,
            loader_range     : loader_version_range
    ]
    inputs.properties(replaceProperties)
    filesMatching("META-INF/neoforge.mods.toml") {
        expand(replaceProperties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
