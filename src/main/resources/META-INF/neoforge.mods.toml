modLoader="javafml"
loaderVersion="${loader_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
mandatory=true
versionRange="${neoforge_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mekanism"
mandatory=true
versionRange="${mekanism_range}"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="mixins/strongermekasuit.json"
